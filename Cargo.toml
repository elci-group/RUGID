# Enable Cargo unstable features for edition 2024
cargo-features = ["edition2024"]

[package]
name = "rugid"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.24.0", features = ["derive"] }
pollster = "0.3"
wgpu = { version = "0.19", optional = true }
winit = "0.29"
glyphon = { version = "0.5", optional = true }
rayon = "1.8"
sha2 = "0.10"
nalgebra = "0.32"  # For OCRS inverse solver (QR decomposition)

# RGPUM dependencies
libloading = { version = "0.8", optional = true }  # Dynamic Vulkan library loading
log = "0.4"

[features]
default = ["wgpu"]
wgpu = ["dep:wgpu", "dep:glyphon"]
rgpum = ["dep:libloading"]

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
env_logger = "0.11"

[[bench]]
name = "physics_precision"
harness = false

[[bench]]
name = "performance"
harness = false